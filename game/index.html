<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Time · Region 9</title><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="/region09-tools/favicon.svg">
<script>
  // Client-side lock only (static site). The game itself runs on r9gametime.grok.me, whose server keeps the rooms.
  var GAME_URL = "https://r9gametime.grok.me/";
  if (sessionStorage.getItem("r9-game-unlocked") === "1") location.replace(GAME_URL);
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f15;color:#eef2f7;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  form{width:min(360px,90vw);background:#111722;border:1px solid #273345;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(220,38,38,.18)}
  h1{margin:0 0 4px;font-size:1.1rem}p{margin:0 0 14px;color:#a9b5c3;font-size:.9rem}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid #273345;background:#1d2633;color:#eef2f7;font:inherit}
  input:focus{outline:2px solid #dc2626;outline-offset:1px}.err{color:#f87171;font-size:.82rem;min-height:1.2em;margin:8px 0 0}
  .row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px}a{color:#9aafc4;font-size:.88rem;text-decoration:none}
  button{padding:8px 16px;border-radius:10px;border:1px solid #dc2626;background:#b91c1c;color:#fff;font:inherit;cursor:pointer}
</style></head>
<body>
<form id="f" autocomplete="off">
  <h1>Game Time</h1><p>This tool is locked. Enter the password to continue.</p>
  <input id="pw" type="password" aria-label="Password" autofocus>
  <div class="err" id="err"></div>
  <div class="row"><a href="/region09-tools/">← Region 9 Tools</a><button type="submit">Unlock</button></div>
</form>
<script>
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw");
    if (pw.value === "Region9") { sessionStorage.setItem("r9-game-unlocked", "1"); location.replace(GAME_URL); }
    else { document.getElementById("err").textContent = "Wrong password. Try again."; pw.select(); }
  });
</script>
</body></html>
