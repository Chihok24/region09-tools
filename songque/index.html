  m.awards.forEach(function(a){var c=cues.find(function(c){return c.awardName.trim().toLowerCase()===String(a.award).trim().toLowerCase()}),id=idOf(a.file);
   if(!c){cues.push({id:crypto.randomUUID(),awardName:a.award,songId:id,position:cues.length});changed=true}
   else if(id&&(!c.songId||!songs.some(function(s){return s.id===c.songId}))&&c.songId!==id){c.songId=id;changed=true}});
  if(changed){var t3=db.transaction(["cues","meta"],"readwrite");cues.forEach(function(c,i){c.position=i;t3.objectStore("cues").put(c)});t3.objectStore("meta").put({key:"seeded",value:true});await done(t3)}
 }
 db.close();return changed}

/* ---------- Publish ---------- */
function gh(tok,path,opt){opt=opt||{};return fetch("https://api.github.com/repos/"+REPO+path,{method:opt.method||"GET",headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined,cache:"no-store"}).then(async function(r){var j=null;try{j=await r.json()}catch(e){}if(!r.ok){var e=new Error((j&&j.message)||("HTTP "+r.status));e.status=r.status;throw e}return j})}
function b64blob(blob){return new Promise(function(a,b){var fr=new FileReader();fr.onload=function(){a(String(fr.result).split(",")[1])};fr.onerror=function(){b(fr.error)};fr.readAsDataURL(blob)})}
function b64txt(s){return btoa(unescape(encodeURIComponent(s)))}
function slug(n){return (String(n).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"song")}
async function publish(tok,log){
 var db=await openDb(),songs=await getAll(db,"songs"),cues=await getAll(db,"cues"),st=await rq(db.transaction("meta").objectStore("meta").get("settings"));
 cues.sort(function(a,b){return a.position-b.position});songs.sort(function(a,b){return a.createdAt-b.createdAt});
 log("Checking GitHub access…");
 var existing={};try{(await gh(tok,"/contents/"+DIR.slice(0,-1)+"?ref=main")).forEach(function(f){existing[f.name]=f.sha})}catch(e){if(e.status!==404)throw e}
 var big=songs.filter(function(s){return s.blob&&s.blob.size>95e6});
 if(big.length)throw new Error("Too big for GitHub (max ~95 MB): "+big.map(function(s){return s.name}).join(", ")+". Trim or compress these, then try again.");
 var used={},tree=[],newFiles={};
 Object.keys(existing).forEach(function(f){used[f]=1});
 for(var i=0;i<songs.length;i++){var s=songs[i];
  var f=s.r9File&&existing[s.r9File]?s.r9File:null;
  if(!f){var ext=(/\.(mp3|m4a|wav|ogg|aac|flac)$/i.exec(s.name||"")||[0,(s.mime||"").indexOf("mp4")>=0?"m4a":(s.mime||"").indexOf("wav")>=0?"wav":"mp3"])[1];
   var b=slug(s.name);f=b+"."+ext;var k=2;while(used[f])f=b+"-"+(k++)+"."+ext;used[f]=1;
   var mb=(s.blob.size/1e6).toFixed(1);log("Uploading "+s.name+" ("+mb+" MB)"+(s.blob.size>50e6?" — large file, this may take a while":"")+"… ["+(i+1)+"/"+songs.length+"]");
   var bl=await gh(tok,"/git/blobs",{method:"POST",body:{content:await b64blob(s.blob),encoding:"base64"}});
   tree.push({path:DIR+f,mode:"100644",type:"blob",sha:bl.sha})}
  newFiles[s.id]=f}
 var ver=new Date().toISOString();
 var man={version:ver,settings:st?{fadeSeconds:st.fadeSeconds,volume:st.volume}:undefined,
  songs:songs.map(function(s){return{name:s.name,file:newFiles[s.id]}}),
  awards:cues.map(function(c){return{award:c.awardName,file:c.songId&&newFiles[c.songId]||null}})};
 tree.push({path:DIR+"manifest.json",mode:"100644",type:"blob",sha:(await gh(tok,"/git/blobs",{method:"POST",body:{content:b64txt(JSON.stringify(man,null,1)),encoding:"base64"}})).sha});
 for(var j=0;j<BR.length;j++){var br=BR[j];log("Saving to "+br+"…");
  for(var tries=0;;tries++){try{
   var ref=await gh(tok,"/git/ref/heads/"+br),cm=await gh(tok,"/git/commits/"+ref.object.sha);
   var nt=await gh(tok,"/git/trees",{method:"POST",body:{base_tree:cm.tree.sha,tree:tree}});
   var nc=await gh(tok,"/git/commits",{method:"POST",body:{message:"Walk-On: publish awards & songs",tree:nt.sha,parents:[ref.object.sha]}});
   await gh(tok,"/git/refs/heads/"+br,{method:"PATCH",body:{sha:nc.sha}});break}catch(e){if(tries<2&&(e.status===409||e.status===422)){await sleep(1500);continue}throw e}}}
 var t=db.transaction("songs","readwrite");songs.forEach(function(s){s.r9File=newFiles[s.id];t.objectStore("songs").put(s)});await done(t);db.close();
 localStorage.setItem(VK,ver);return man}
